# FactoryDocSync:
# docs:
# - docs/features/F-001-doctrine-foundation.md
# - docs/design-docs/ADR-004-pr-first-publication.md
# - docs/code-documentation-map.md
name: Foundation quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-commit-gate:
    name: Public commit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go from the module declaration
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.11
          cache: false

      - name: Build the offline validator
        run: go build -trimpath -o "${RUNNER_TEMP}/mars3" ./cmd/mars3

      - name: Check doctrine
        run: '"${RUNNER_TEMP}/mars3" doctrine check --repo .'

      - name: Check the active plan
        run: '"${RUNNER_TEMP}/mars3" plan check --repo .'

      - name: Audit documentation ownership
        run: '"${RUNNER_TEMP}/mars3" docsync audit --repo .'

      - name: Check immediate public disclosure
        run: '"${RUNNER_TEMP}/mars3" public-check --repo .'

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Check whitespace
        run: |
          git diff --check
          git show --check --oneline --no-renames HEAD

      - name: Prove the pinned secret scanner detects a synthetic canary
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks-canary"
          printf '%s%s\n' 'ghp_' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789' > "${RUNNER_TEMP}/gitleaks-canary/input.txt"
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "${RUNNER_TEMP}/gitleaks-canary:/scan:ro" \
            docker.io/zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --no-git --source /scan --redact --no-banner; then
            echo "secret-scanner canary was not detected" >&2
            exit 1
          fi

      - name: Scan the worktree and complete Git history
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            docker.io/zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --no-git --source . --redact --no-banner
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            docker.io/zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source . --redact --no-banner
