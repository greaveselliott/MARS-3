    - local-public-commit-gate
    - signed-commit-and-review-tag
    - exact-head-CI
    - qa
    - security-reviewer
    - merge
    - protected-main-readback
    - delivery-orchestrator-reconciliation
  retainedApprovalBoundaries:
    - production-effects-or-release
    - destructive-or-irreversible-effects
    - credentials-secrets-billing-private-data-or-external-account-access
    - trust-escalation
    - another-Bead-or-downstream-ticket
    - goal-feature-declared-path-or-effect-class-expansion
    - direct-Beads-Dolt-PostgreSQL-or-other-authority-store-mutation
    - workflow-dependency-runtime-API-or-database-design-change
  prohibitedEffects:
    - infer-authority-for-an-unbound-or-future-Bead
    - bypass-the-gateway-for-canonical-authority-state
    - weaken-required-CI-QA-Security-signature-or-protected-main-gates
    - reuse-move-delete-rewrite-or-resign-an-immutable-review-tag
    - continue-after-the-second-equivalent-failure
    - open-a-successor-PR-while-an-earlier-bound-Bead-delivery-PR-remains-open
