schema_version: 1
project: MARS-3
visibility: public
license: Apache-2.0
default_effective_trust: observer
autonomous_mutation: disabled

authority:
  work_definition_system: beads-dolt
  live_lease_system: postgresql-gateway
  execution_system: temporal-non-authoritative
  current_bead: M3-W001
  current_bead_state: in-progress
  current_bead_claimed: true
  plan_phase: delivery
  active_delivery_grant: W-001-lifecycle-terminal-history-scan-recovery-v1
  active_attempt: w001-lifecycle-terminal-history-scan-recovery-v1
  live_lease_state: absent
  durable_product_system: git
  markdown_ticket_authority: prohibited
  genesis_is_provenance_only: true

delivery:
  active_plan: docs/exec-plans/active/current-operating-plan.md
  feature_root: docs/features
  decision_root: docs/product-decisions
  evidence_required: true
  default_publication: pull-request
  automatic_retry_limit_per_fingerprint: 1

provenance:
  mars_repository: https://github.com/greaveselliott/MARS
  mars_commit: f55d129bfc794510ca485bb54fc0a35c7b04a700
  mars_license: Apache-2.0
  generated_manifest: .harness/generated/mars/source-manifest.json
  refresh_scope:
    - .harness/generated/mars/source-manifest.json

security:
  accepted_base_label: public+project-accepted
  proposed_worktree_label: public+project-proposed
  external_input_label: external-untrusted
  rule_of_two: declared
  trace_spine: declared
  raw_payload_persistence: prohibited
  secret_persistence: prohibited

